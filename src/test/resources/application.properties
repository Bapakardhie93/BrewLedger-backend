spring.application.name=brewledger-backend
server.port=8081

# H2 Database settings for isolation during tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Bootstrap Admin Mock Credentials for test context
brewledger.admin.full-name=Test Admin
brewledger.admin.username=testadmin
brewledger.admin.password=testpassword

jwt.secret=test-secret-key-test-secret-key-test-secret-key-test-secret-key
jwt.expiration=86400000

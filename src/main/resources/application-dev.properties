# Local development profile. Starts without an external PostgreSQL server.

spring.datasource.url=${DEV_DB_URL:jdbc:h2:file:./data/brewledger-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DEV_DB_USERNAME:sa}
spring.datasource.password=${DEV_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

brewledger.admin.full-name=${ADMIN_FULLNAME:Satriya Dwi Mahardhika}
brewledger.admin.username=${ADMIN_USERNAME:admin}
brewledger.admin.password=${ADMIN_PASSWORD:admin}

jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-dev-secret-key}
